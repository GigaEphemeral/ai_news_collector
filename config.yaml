# AI 情报 MVP · 采集配置
# 非秘密配置放这里;秘密(如 GITHUB_PAT)一律只放 .env(默认取项目根上两级目录的 .env)
app:
  name: ai-news-mvp
  since_days_default: 7        # run.py 默认采集窗口(--since-days 可覆盖)

# 相对项目根(code/ai-news-mvp)的路径;可用环境变量覆盖:
#   AI_NEWS_DATA_DIR / AI_NEWS_LOG_DIR / AI_NEWS_DB_PATH / AI_NEWS_ENV_PATH
paths:
  data_dir: "../../data"       # 项目根上两级的 data 目录
  log_dir: "../../logs"        # 项目根上两级的 logs 目录
  db_file: "ai_news_mvp.sqlite3"

# 复用原项目 rss_fetcher 时,它通过 ConfigLoader 单例读取以下键(勿删)
fetching:
  network_timeout: 90
  hf_daily_top_n: 5            # HF Daily Papers 按(upvotes+stars)排名保留前 N 篇

github:
  api_base: "https://api.github.com"
  per_page: 30                 # 每组查询每页上限(搜索 API;search 30/min 上限内)
  per_platform_cap: 10         # 每平台候选上限(在跨源去重之后执行,见 run.py 处理顺序)
  sort: "stars"
  order: "desc"
  timeout: 30                  # 单请求超时(秒)
  retries: 2                   # 5xx/网络错误退避重试次数(403/429 不硬闯)
  backoff_seconds: 2           # 退避基数(指数退避:2s,4s)
  request_interval_seconds: 1.2  # search API 30/min,查询间留余量
  queries:                     # 3 组查询模板,{d} = 程序动态计算的 YYYY-MM-DD
    - name: "新项目"
      template: "topic:ai created:>{d} stars:>=20"
    - name: "新兴Agent"
      template: "topic:agents pushed:>{d} stars:>=50"
    - name: "活跃LLM项目"
      template: "topic:llm pushed:>{d} stars:>=100"

hackernews:
  api_base: "https://hacker-news.firebaseio.com/v0"
  top_n: 50                    # topstories 取前 N 条
  min_points: 100              # 热度阈值(score)
  min_age_hours: 2             # 过新帖子热度未聚集,过滤
  max_age_days: 3              # 帖子最大年龄
  per_platform_cap: 10
  timeout: 30
  retries: 2
  backoff_seconds: 2

rss:
  max_age_days: 7              # 普通博客条目最大年龄
  per_platform_cap: 10         # RSS 平台(全部博客合并)候选上限
  feed_max_entries: 60         # 超大 feed 早期截断:最多保留前 N 条
  feed_max_bytes: 262144       # 超过该字节数触发截断(OpenAI feed ~785KB)
  timeout: 60
  retries: 2
  backoff_seconds: 2
  sources:
    - name: "OpenAI Blog"
      url: "https://openai.com/news/rss.xml"
      category: "news"
    - name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
      category: "news"
    - name: "Google DeepMind Blog"
      url: "https://deepmind.google/blog/rss.xml"
      category: "news"
    - name: "NVIDIA Developer Blog"
      url: "https://developer.nvidia.com/blog/feed/"
      category: "news"

hf_papers:
  url: "https://huggingface.co/api/daily_papers"
  name: "HF Daily Papers"
  per_platform_cap: 10         # HF 平台候选上限(实际条目数由 fetching.hf_daily_top_n 决定)
  max_age_days: 14             # HF 按周批,放宽年龄窗口

dedup:
  simhash_threshold: 4         # 标题 SimHash 汉明距离阈值(越小越严格)
  similarity_threshold: 0.8    # 标题/摘要 token 集合 Jaccard 相似度 ≥ 该值 → 判为重复(阶段04修复 AIQI-7)

# 规则趋势引擎(阶段03;纯规则、不评分、不调 LLM;阈值可按观察期调整)
trend:
  # 三个时间尺度各需要的最小历史天数(不足的窗口明确标注"窗口不足")
  windows:
    "24h": 2                   # 昨日 + 今日两个连续快照日即可算 24h 增量
    "7d": 7                    # 近 7 个观察日
    "30d": 30                  # 近 30 个观察日(前 7 天建基线,14 天看周趋势,30 天才启用月趋势)
  project:
    young_days: 30             # 创建 ≤ 30 天 → 新项目(新鲜度证据)
    sudden_growth_ratio: 3.0   # 24h 增量 ≥ 前 7d 日均增量 × 3 → 突然增长
    warming_min_days: 3        # 连续 N 天正增长且趋势不减 → 持续升温
    warming_min_growth_pct: 0.5  # 连续窗口期累计增长率 < 该值(%)→ 幅度不足,标"尚待观察"
    maturity_stars: 50000      # Star 总数 ≥ 该值 → 成熟期候选
    maturity_growth_pct: 0.05  # 近 7 天日均增长率 ≤ 该值(%) → 稳定/成熟
    decline_negative_days: 2   # 连续 N 天负增长 → 热度回落(不单日下结论)
    stagnation_days: 7         # 连续 N 日入选且近 N 日增量≈0 → 降权(重复过滤)
    stagnation_max_delta_pct: 0.05  # 近 N 天总增量 ≤ 该比例(%)视为无新变化
  topic:
    sudden_growth_ratio: 2.0   # 当日条目数 ≥ 前 N 日均值 × 2 → 突然增长
    warming_min_days: 3        # 连续 N 天增量且 ≥1 天多来源 → 持续升温
    maturity_min_count: 3      # 近 7 天日均条目数 ≥ 该值 → 成熟期候选
    decline_negative_days: 2   # 连续 N 天条目数递减 → 热度回落

# 主题归属(阶段03 topic_daily_stats)
topics:
  max_per_item: 3              # 每条目最多取 N 个主题(GitHub 取 extra.topics 前 N)

# 规则初筛关键词(仅 HN/RSS/HF 标题+摘要命中判断;不做评分)
keywords:
  ai:
    - "ai"
    - "llm"
    - "gpt"
    - "agent"
    - "rag"
    - "anthropic"
    - "openai"
    - "deepseek"
    - "gemini"
    - "claude"
    - "codex"
    - "inference"
    - "diffusion"
    - "transformer"
    - "machine learning"
    - "neural"
    - "fine-tun"
    - "finetun"
    - "model serving"
    - "embedding"
    - "multimodal"
    - "reasoning model"
    - "agentic"

limits:
  per_platform_cap: 10         # 每个平台每日候选上限(硬性约束 #8)

# ---- 阶段04:日报与飞书(秘密 FEISHU_WEBHOOK_URL / FEISHU_WEBHOOK_KEYWORD 只在 .env) ----
# 阶段04修复(AIQI-7):排序策略/上榜理由/解决方案摘要,阈值全部可配置
report:
  required_keyword: "每日ai情报"  # 飞书自定义机器人安全关键词(发送文本必须包含;env 可覆盖)
  max_chars: 6000                # 日报文本长度上限(超长自动裁剪,不发送失败)
  highlights_cap: 8              # 入选 Top N(交给 Ollama 或规则挑选)
  max_highlights: 3              # 一、今日值得关注 最多条数
  opensource_max: 5              # 二、开源项目与工程实践 最多条数
  solutions_max: 5               # 三、解决方案与产品发布 最多条数
  trends_projects_max: 3         # 四、趋势观察 项目最多条数
  trends_topics_max: 3           # 四、趋势观察 主题最多条数
  # 排序策略(问题1修复,成员修正版:新生代优先,兼顾老项目增量):
  #   freshness(默认):新生代(创建 ≤ new_days)优先;老项目仅当 24h 增量或增长率达阈值才允许上榜
  #   growth: 按 24h Star 增量降序(有增量的在前,无增量数据垫底)
  #   stars:  按 Star 总数降序(旧行为;仅当明确需要时选用)
  sort_by: freshness
  new_days: 30                   # 创建 ≤ 该天数 → 新生代(与 trend.project.young_days 一致)
  old_repo_min_delta_24h: 50     # 老项目(创建 > new_days)上榜「今日值得关注」的最低 24h Star 增量
  old_repo_min_growth_pct: 0.5   # 或 24h 增长率 ≥ 该值(%)(满足其一即可上榜)
  recent_push_days: 7            # 快照不足(首日/无法算 24h 增量)时,新生代须近期 push 窗口(天)
  # 解决方案与产品发布一行摘要(问题2修复,成员修正版):
  #   fetch_summary=false(默认,成员自用不开启):只显示库中已有 summary,为空注明理由;
  #   true:对入选条目抓正文首段(复用 content_processor)或调 Ollama 生成一句话摘要,仍失败则注明理由
  fetch_summary: false
  summary_max_chars: 80          # 「解决方案与产品发布」一行摘要最大长度

ollama:
  base_url: "http://192.168.0.103:11434"  # Windows 笔记本上的 Ollama(局域网)
  model: "Qwen3.5:9B"
  enabled: true                  # 可选:不可达时自动降级为规则标签
  timeout: 180                   # 单次调用超时(秒)
  think: false                   # 关闭 thinking(该模型默认开 thinking)
  num_predict: 2048              # 给足生成预算,避免短预算空输出
  temperature: 0.2
  min_output_items: 3            # 模型有效输出下限(低于则整体降级)
  max_output_items: 5            # 模型输出条数上限

feishu:
  timeout: 30                    # 单次 POST 超时(秒)
  max_retries: 3                 # 明确失败时的指数退避重试次数
  backoff_seconds: 3             # 退避基数(3s,6s)

